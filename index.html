<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0b4f8a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="でんしゃパッド" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="style.css?v=4" />
  <title>でんしゃパッド</title>
</head>
<body>
  <main class="app-shell" aria-label="でんしゃパッド">
    <header class="app-header">
      <div>
        <div class="eyebrow">TRAIN SOUND PAD</div>
        <h1>でんしゃパッド</h1>
      </div>
      <button id="parentBtn" class="parent-btn" aria-label="おとな設定。2秒長押し">設定</button>
    </header>

    <section class="status-panel" aria-live="polite">
      <span class="status-dot"></span>
      <span id="statusText">ボタンをおしてください</span>
    </section>

    <section class="sound-grid" aria-label="数字ボタン">
      <button class="sound-btn" data-slot="7"><span class="sound-label" id="label7">7</span></button>
      <button class="sound-btn" data-slot="8"><span class="sound-label" id="label8">8</span></button>
      <button class="sound-btn" data-slot="9"><span class="sound-label" id="label9">9</span></button>
      <button class="sound-btn" data-slot="4"><span class="sound-label" id="label4">4</span></button>
      <button class="sound-btn" data-slot="5"><span class="sound-label" id="label5">5</span></button>
      <button class="sound-btn" data-slot="6"><span class="sound-label" id="label6">6</span></button>
      <button class="sound-btn" data-slot="1"><span class="sound-label" id="label1">1</span></button>
      <button class="sound-btn" data-slot="2"><span class="sound-label" id="label2">2</span></button>
      <button class="sound-btn" data-slot="3"><span class="sound-label" id="label3">3</span></button>
      <button class="sound-btn zero-btn" data-slot="0"><span class="sound-label" id="label0">0</span></button>
    </section>

    <footer class="app-footer">おとな設定は2秒長押し</footer>
  </main>

  <dialog id="pinDialog" class="dialog-card">
    <form method="dialog" id="pinForm">
      <h2>おとな設定</h2>
      <p>暗証番号を入力してください。</p>
      <input id="pinInput" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off" placeholder="初期値 2580" />
      <p id="pinError" class="error-text" hidden>暗証番号が違います。</p>
      <div class="dialog-actions">
        <button type="button" id="pinCancel" class="secondary">キャンセル</button>
        <button value="default" id="pinOk" class="primary">開く</button>
      </div>
    </form>
  </dialog>

  <dialog id="settingsDialog" class="settings-dialog">
    <div class="settings-wrap">
      <header class="settings-header">
        <div>
          <div class="eyebrow">PARENT MODE</div>
          <h2>おとな設定</h2>
        </div>
        <button id="closeSettings" class="close-btn" aria-label="設定を閉じる">閉じる</button>
      </header>

      <section class="help-box">
        <strong>音の登録方法</strong><br />
        「録音」でその場で登録するか、「音声ファイルを選ぶ」で MP3・M4A・WAV などの音声を登録できます。<br />
        録音するときは「録音」→ 話す →「停止して保存」です。最初だけマイクの許可が出ます。
      </section>

      <section id="slotSettings" class="slot-settings"></section>

      <section class="parent-options">
        <h3>おとな用設定</h3>
        <label>
          暗証番号
          <input id="newPin" inputmode="numeric" pattern="[0-9]*" maxlength="8" />
        </label>
        <button id="savePin" class="secondary wide">暗証番号を変更</button>
      </section>

      <section class="info-box">
        <strong>音声データについて</strong><br />
        録音した音声や選んだ音声ファイルは、この iPhone のブラウザ内に保存します。この PWA から外部へ自動送信しません。
      </section>
    </div>
  </dialog>

  <script src="app.js?v=4"></script>
</body>
</html>
